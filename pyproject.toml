[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "state-id-harvester"
version = "0.1.0"
description = "Auditable public-source US driver license and ID reference library for 50 states and DC"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx[http2]==0.28.1", "pymupdf==2.0", "pydantic>=2.9,<3",
    "numpy>=2,<3", "opencv-python-headless>=4.10,<5",
]

[project.scripts]
state-id-harvester = "state_id_harvester.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "mypy>=1.13,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/state_id_harvester"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
