name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: uv==0.13.5
      - run: uv sync --locked --dev --no-build --no-install-project
      - run: uv run --locked --no-sync --no-build ruff check .
      - run: uv run --locked --no-sync --no-build ruff format --check .
      - run: uv run --locked --no-sync --no-build mypy src
      - run: uv run --locked --no-sync --no-build pytest --cov=state_id_harvester --cov-report=xml -q
      - run: uv run --locked --no-sync --no-build python scripts/export_schemas.py --check
      - run: uv run --locked --no-sync --no-build python scripts/check_publication.py
      - run: uv build --no-build-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage.xml
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts
      - run: npm run check --prefix web
      - run: npm run check:types --prefix web
      - run: npm test --prefix web -- --coverage
      - run: npm run build --prefix web
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: uv==0.13.5
      - run: uv sync --locked --dev --no-build --no-install-project
      - run: uv run --locked --no-sync --no-build python scripts/check_publication.py --bundled web/dist
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - run: npm audit --prefix web --omit=dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage
          path: web/coverage/lcov.info
