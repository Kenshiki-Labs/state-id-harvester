name: Build reference library
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refetch existing PDFs as well as discovering new sources
        type: boolean
        default: true
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: reference-library
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      CADASTRE_INGEST_KEY: ${{ secrets.CADASTRE_INGEST_KEY }}
      PYTHONPATH: src
      CADASTRE_VAULT_URL: https://cadastre.kenshikilabs.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: uv==0.13.5
      - run: uv sync --locked --no-install-project --no-build
      - name: Require private publication credentials
        run: test -n "$CADASTRE_INGEST_KEY"
      - name: Install local OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Restore last private snapshot
        run: uv run --locked --no-sync --no-build python scripts/vault_sync.py pull output --missing-ok
      - name: Harvest all 51 jurisdictions
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh }}
        run: |
          refresh_args=()
          if [ "$REFRESH" = true ]; then refresh_args+=(--refresh); fi
          uv run --locked --no-sync --no-build python -m state_id_harvester harvest --all --workers 2 --max-pdf-bytes 67108864 --ocr "${refresh_args[@]}"
      - name: Collect federal sources separately
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh }}
        run: |
          refresh_args=()
          if [ "$REFRESH" = true ]; then refresh_args+=(--refresh); fi
          uv run --locked --no-sync --no-build python -m state_id_harvester harvest --federal --output output/federal --workers 2 --ocr --crawl-pages 3 "${refresh_args[@]}"
      - run: uv run --locked --no-sync --no-build python -m state_id_harvester verify --output output/federal
      - run: uv run --locked --no-sync --no-build python -m state_id_harvester verify
      - name: Collect original agency HTML gallery images
        run: uv run --locked --no-sync --no-build python -m state_id_harvester harvest-images --all --output output/gallery
      - name: Verify gallery bytes and parent HTML bindings
        run: uv run --locked --no-sync --no-build python -m state_id_harvester verify-images --output output/gallery
      - run: uv run --locked --no-sync --no-build python -m state_id_harvester export-catalog
      - name: Export citation metadata and reviewed geometry
        run: uv run --locked --no-sync --no-build python scripts/build_public_catalog.py
      - name: Check public publication boundary
        run: uv run --locked --no-sync --no-build python scripts/check_publication.py
      - name: Package and upload private snapshot
        run: |
          uv run --locked --no-sync --no-build python scripts/package_library.py output "$RUNNER_TEMP/cadastre-snapshot"
          uv run --locked --no-sync --no-build python scripts/vault_sync.py push "$RUNNER_TEMP/cadastre-snapshot"
      - name: Prepare visibly marked private specimen candidates
        run: |
          uv run --locked --no-sync --no-build python scripts/vault_sync.py prepare-specimens output "$RUNNER_TEMP/cadastre-specimens" --limit 100
          uv run --locked --no-sync --no-build python scripts/vault_sync.py push-specimens "$RUNNER_TEMP/cadastre-specimens"
      - name: Record public metadata only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add library/federal.json library/manifest.json library/coverage.json library/summary.json library/coverage.md web/public/data web/public/schemas web/public/wireframes
          if ! git diff --cached --quiet; then
            git commit -m "Update Cadastre public metadata and reviewed geometry"
            git push origin HEAD:main
          fi
      # Source PDFs, crops, OCR, archives, and private ledgers never enter GitHub
      # releases or Actions artifacts. Failure stops before public commit.
